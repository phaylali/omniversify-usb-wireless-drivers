PACKAGE_NAME="zt9101"
PACKAGE_VERSION="1.2.1800.20241115"
AUTOINSTALL="yes"

# DKMS runs this from the module's build dir (it does `cd "$build_dir"`), so the
# wrapper Makefile resolves WDRV_DIR from pwd. It also prepends
# "KERNELRELEASE=$kernelver" and appends "LLVM=1" itself (clang-detected from
# vmlinux), so no compiler flags are needed here.
MAKE[0]="make"

BUILT_MODULE_NAME[0]="zt9101_ztopmac_usb"
DEST_MODULE_LOCATION[0]="/updates"
